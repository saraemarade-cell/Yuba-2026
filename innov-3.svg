<svg viewBox="0 0 800 500" width="800" height="500" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="50%" r="55%"><stop offset="0%" stop-color="#08102a"/><stop offset="100%" stop-color="#040315"/></radialGradient>
    <radialGradient id="ga3" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#d21c82" stop-opacity="0.20"/><stop offset="100%" stop-color="#d21c82" stop-opacity="0"/></radialGradient>
    <radialGradient id="gb3" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#5bc2fc" stop-opacity="0.20"/><stop offset="100%" stop-color="#5bc2fc" stop-opacity="0"/></radialGradient>
    <radialGradient id="gc3" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#6c20d2" stop-opacity="0.20"/><stop offset="100%" stop-color="#6c20d2" stop-opacity="0"/></radialGradient>
    <radialGradient id="gd3" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#da980e" stop-opacity="0.18"/><stop offset="100%" stop-color="#da980e" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg3)"/>

  <!-- Cluster glows -->
  <ellipse cx="175" cy="140" rx="130" ry="110" fill="url(#ga3)"/>
  <ellipse cx="625" cy="140" rx="130" ry="110" fill="url(#gb3)"/>
  <ellipse cx="175" cy="370" rx="130" ry="110" fill="url(#gc3)"/>
  <ellipse cx="625" cy="370" rx="130" ry="110" fill="url(#gd3)"/>

  <!-- Inter-cluster bridge lines -->
  <g stroke="rgba(232,228,220,0.5)" stroke-width="0.5" opacity="0.12" fill="none" stroke-dasharray="4,10">
    <line x1="248" y1="140" x2="395" y2="250"/><line x1="552" y1="140" x2="405" y2="250"/>
    <line x1="248" y1="370" x2="395" y2="250"/><line x1="552" y1="370" x2="405" y2="250"/>
    <line x1="248" y1="140" x2="552" y2="140"/><line x1="248" y1="370" x2="552" y2="370"/>
    <line x1="175" y1="240" x2="175" y2="270"/><line x1="625" y1="240" x2="625" y2="270"/>
  </g>

  <!-- CLUSTER A — Fuchsia — top-left (Fashion/Luxury) -->
  <g stroke="#d21c82" fill="#d21c82">
    <!-- Internal lines -->
    <g stroke-width="0.5" opacity="0.22" fill="none">
      <line x1="145" y1="100" x2="210" y2="80"/><line x1="145" y1="100" x2="220" y2="150"/>
      <line x1="145" y1="100" x2="155" y2="170"/><line x1="145" y1="100" x2="88" y2="155"/>
      <line x1="145" y1="100" x2="76" y2="105"/><line x1="210" y1="80" x2="220" y2="150"/>
      <line x1="220" y1="150" x2="155" y2="170"/><line x1="88" y1="155" x2="76" y2="105"/>
    </g>
    <!-- Nodes -->
    <circle cx="145" cy="100" r="7" opacity="0.9"/><circle cx="145" cy="100" r="3" fill="rgba(232,228,220,0.9)"/>
    <circle cx="210" cy="80" r="4" opacity="0.75"/><circle cx="220" cy="150" r="4" opacity="0.75"/>
    <circle cx="155" cy="170" r="3.5" opacity="0.65"/><circle cx="88" cy="155" r="3.5" opacity="0.65"/>
    <circle cx="76" cy="105" r="3" opacity="0.55"/><circle cx="248" cy="110" r="2.5" opacity="0.45"/>
    <circle cx="108" cy="62" r="2.5" opacity="0.40"/>
  </g>

  <!-- CLUSTER B — Azure — top-right (Media/Entertainment) -->
  <g stroke="#5bc2fc" fill="#5bc2fc">
    <g stroke-width="0.5" opacity="0.22" fill="none">
      <line x1="650" y1="100" x2="590" y2="78"/><line x1="650" y1="100" x2="580" y2="148"/>
      <line x1="650" y1="100" x2="648" y2="168"/><line x1="650" y1="100" x2="712" y2="145"/>
      <line x1="650" y1="100" x2="724" y2="98"/><line x1="590" y1="78" x2="580" y2="148"/>
      <line x1="712" y1="145" x2="724" y2="98"/>
    </g>
    <circle cx="650" cy="100" r="7" opacity="0.9"/><circle cx="650" cy="100" r="3" fill="rgba(232,228,220,0.9)"/>
    <circle cx="590" cy="78" r="4" opacity="0.75"/><circle cx="580" cy="148" r="4" opacity="0.75"/>
    <circle cx="648" cy="168" r="3.5" opacity="0.65"/><circle cx="712" cy="145" r="3.5" opacity="0.65"/>
    <circle cx="724" cy="98" r="3" opacity="0.55"/><circle cx="552" cy="108" r="2.5" opacity="0.45"/>
    <circle cx="690" cy="62" r="2.5" opacity="0.40"/>
  </g>

  <!-- CLUSTER C — Violet — bottom-left (Industry/Corp) -->
  <g stroke="#6c20d2" fill="#6c20d2">
    <g stroke-width="0.5" opacity="0.22" fill="none">
      <line x1="148" y1="400" x2="210" y2="420"/><line x1="148" y1="400" x2="220" y2="355"/>
      <line x1="148" y1="400" x2="155" y2="330"/><line x1="148" y1="400" x2="88" y2="345"/>
      <line x1="148" y1="400" x2="78" y2="398"/><line x1="210" y1="420" x2="220" y2="355"/>
      <line x1="88" y1="345" x2="78" y2="398"/>
    </g>
    <circle cx="148" cy="400" r="7" opacity="0.9"/><circle cx="148" cy="400" r="3" fill="rgba(232,228,220,0.9)"/>
    <circle cx="210" cy="420" r="4" opacity="0.75"/><circle cx="220" cy="355" r="4" opacity="0.75"/>
    <circle cx="155" cy="330" r="3.5" opacity="0.65"/><circle cx="88" cy="345" r="3.5" opacity="0.65"/>
    <circle cx="78" cy="398" r="3" opacity="0.55"/><circle cx="248" cy="390" r="2.5" opacity="0.45"/>
    <circle cx="108" cy="440" r="2.5" opacity="0.40"/>
  </g>

  <!-- CLUSTER D — Gold — bottom-right (Lifestyle/Health) -->
  <g stroke="#da980e" fill="#da980e">
    <g stroke-width="0.5" opacity="0.22" fill="none">
      <line x1="650" y1="400" x2="590" y2="422"/><line x1="650" y1="400" x2="580" y2="352"/>
      <line x1="650" y1="400" x2="650" y2="330"/><line x1="650" y1="400" x2="714" y2="350"/>
      <line x1="650" y1="400" x2="724" y2="402"/><line x1="590" y1="422" x2="580" y2="352"/>
      <line x1="714" y1="350" x2="724" y2="402"/>
    </g>
    <circle cx="650" cy="400" r="7" opacity="0.9"/><circle cx="650" cy="400" r="3" fill="rgba(232,228,220,0.9)"/>
    <circle cx="590" cy="422" r="4" opacity="0.75"/><circle cx="580" cy="352" r="4" opacity="0.75"/>
    <circle cx="650" cy="330" r="3.5" opacity="0.65"/><circle cx="714" cy="350" r="3.5" opacity="0.65"/>
    <circle cx="724" cy="402" r="3" opacity="0.55"/><circle cx="552" cy="392" r="2.5" opacity="0.45"/>
    <circle cx="690" cy="440" r="2.5" opacity="0.40"/>
  </g>

  <!-- CENTRAL HUB — white -->
  <g>
    <circle cx="400" cy="250" r="40" fill="rgba(232,228,220,0.04)" stroke="rgba(232,228,220,0.12)" stroke-width="0.6"/>
    <circle cx="400" cy="250" r="24" fill="rgba(232,228,220,0.04)"/>
    <circle cx="400" cy="250" r="6.5" fill="rgba(232,228,220,0.85)"/>
    <circle cx="400" cy="250" r="3" fill="rgba(232,228,220,0.98)"/>
  </g>

  <!-- Bridge nodes -->
  <g fill="rgba(232,228,220,0.50)">
    <circle cx="308" cy="192" r="3"/><circle cx="492" cy="192" r="3"/>
    <circle cx="308" cy="308" r="3"/><circle cx="492" cy="308" r="3"/>
  </g>

  <!-- Cluster labels -->
  <g font-family="monospace" font-size="7.5" letter-spacing="0.13em" text-anchor="middle">
    <text x="145" y="44" fill="rgba(210,28,130,0.45)">BRAND · LUXURY</text>
    <text x="652" y="44" fill="rgba(91,194,252,0.45)">MEDIA · CULTURE</text>
    <text x="148" y="476" fill="rgba(108,32,210,0.45)">INDUSTRY · CORP</text>
    <text x="652" y="476" fill="rgba(218,152,14,0.45)">LIFESTYLE · HEALTH</text>
    <text x="400" y="268" fill="rgba(232,228,220,0.30)">ECOSYSTEM</text>
  </g>
</svg>
