    <circle cx="400" cy="16" r="2"/><circle cx="664" cy="96" r="2"/><circle cx="664" cy="404" r="2"/>
    <circle cx="400" cy="484" r="2"/><circle cx="136" cy="404" r="2"/><circle cx="136" cy="96" r="2"/>
    <circle cx="86" cy="250" r="1.5"/><circle cx="714" cy="250" r="1.5"/>
    <circle cx="248" cy="40" r="1.5"/><circle cx="552" cy="40" r="1.5"/>
    <circle cx="248" cy="462" r="1.5"/><circle cx="552" cy="462" r="1.5"/>
