    <circle cx="548" cy="164" r="17" fill="url(#ng1)"/><circle cx="548" cy="164" r="5.5" fill="#5bc2fc" opacity="0.9"/><circle cx="548" cy="164" r="2.4" fill="rgba(232,228,220,0.9)"/>
    <circle cx="548" cy="336" r="17" fill="url(#ng1)"/><circle cx="548" cy="336" r="5.5" fill="#5bc2fc" opacity="0.9"/><circle cx="548" cy="336" r="2.4" fill="rgba(232,228,220,0.9)"/>
    <circle cx="400" cy="422" r="17" fill="url(#ng1)"/><circle cx="400" cy="422" r="5.5" fill="#5bc2fc" opacity="0.9"/><circle cx="400" cy="422" r="2.4" fill="rgba(232,228,220,0.9)"/>
    <circle cx="252" cy="336" r="17" fill="url(#ng1)"/><circle cx="252" cy="336" r="5.5" fill="#5bc2fc" opacity="0.9"/><circle cx="252" cy="336" r="2.4" fill="rgba(232,228,220,0.9)"/>
    <circle cx="252" cy="164" r="17" fill="url(#ng1)"/><circle cx="252" cy="164" r="5.5" fill="#5bc2fc" opacity="0.9"/><circle cx="252" cy="164" r="2.4" fill="rgba(232,228,220,0.9)"/>
  </g>
