<svg viewBox="0 0 800 500" width="800" height="500" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg1" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#0c1e4a"/><stop offset="100%" stop-color="#040315"/></radialGradient>
    <radialGradient id="hg1" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#5bc2fc" stop-opacity="0.30"/><stop offset="100%" stop-color="#5bc2fc" stop-opacity="0"/></radialGradient>
    <radialGradient id="ng1" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#5bc2fc" stop-opacity="0.55"/><stop offset="100%" stop-color="#5bc2fc" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg1)"/>
  <ellipse cx="400" cy="250" rx="230" ry="195" fill="url(#hg1)"/>
  <!-- Hub → primary lines -->
  <g stroke="#5bc2fc" stroke-width="0.8" opacity="0.30" fill="none">
    <line x1="400" y1="250" x2="400" y2="78"/><line x1="400" y1="250" x2="548" y2="164"/>
    <line x1="400" y1="250" x2="548" y2="336"/><line x1="400" y1="250" x2="400" y2="422"/>
    <line x1="400" y1="250" x2="252" y2="336"/><line x1="400" y1="250" x2="252" y2="164"/>
  </g>
