    <line x1="548" y1="336" x2="664" y2="404"/><line x1="400" y1="422" x2="400" y2="484"/>
    <line x1="252" y1="336" x2="136" y2="404"/><line x1="252" y1="164" x2="136" y2="96"/>
  </g>
