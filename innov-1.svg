<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="i1bg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0a0830"/>
      <stop offset="100%" stop-color="#040315"/>
    </radialGradient>
    <radialGradient id="i1glowC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5bc2fc" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#5bc2fc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i1glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5bc2fc" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#5bc2fc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i1glowV" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6c20d2" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#6c20d2" stop-opacity="0"/>
    </radialGradient>
    <filter id="i1glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="i1sm" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <pattern id="i1dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="0.7" fill="rgba(255,255,255,0.04)"/>
    </pattern>
    <!-- Person clip circles -->
    <clipPath id="i1cp0"><circle cx="400" cy="250" r="38"/></clipPath>
    <clipPath id="i1cp1"><circle cx="568" cy="250" r="24"/></clipPath>
    <clipPath id="i1cp2"><circle cx="484" cy="396" r="24"/></clipPath>
    <clipPath id="i1cp3"><circle cx="316" cy="396" r="24"/></clipPath>
    <clipPath id="i1cp4"><circle cx="232" cy="250" r="24"/></clipPath>
    <clipPath id="i1cp5"><circle cx="316" cy="104" r="24"/></clipPath>
    <clipPath id="i1cp6"><circle cx="484" cy="104" r="24"/></clipPath>
  </defs>

  <rect width="800" height="500" fill="url(#i1bg)"/>
  <rect width="800" height="500" fill="url(#i1dots)"/>

  <!-- Orbital rings -->
  <circle cx="400" cy="250" r="220" fill="none" stroke="#5bc2fc" stroke-width="0.5" stroke-opacity="0.10" stroke-dasharray="4 14"/>
  <circle cx="400" cy="250" r="168" fill="none" stroke="#5bc2fc" stroke-width="0.5" stroke-opacity="0.14" stroke-dasharray="3 11"/>
  <circle cx="400" cy="250" r="65"  fill="none" stroke="#5bc2fc" stroke-width="0.6" stroke-opacity="0.18" stroke-dasharray="2 8"/>

  <!-- ── SPOKE LINES (center → satellites) ─── -->
  <line x1="400" y1="250" x2="568" y2="250"  stroke="#5bc2fc" stroke-width="1.2" stroke-opacity="0.30"/>
  <line x1="400" y1="250" x2="484" y2="396"  stroke="#6c20d2" stroke-width="1.0" stroke-opacity="0.26"/>
  <line x1="400" y1="250" x2="316" y2="396"  stroke="#5bc2fc" stroke-width="1.0" stroke-opacity="0.26"/>
  <line x1="400" y1="250" x2="232" y2="250"  stroke="#6c20d2" stroke-width="1.2" stroke-opacity="0.28"/>
  <line x1="400" y1="250" x2="316" y2="104"  stroke="#5bc2fc" stroke-width="1.0" stroke-opacity="0.28"/>
  <line x1="400" y1="250" x2="484" y2="104"  stroke="#6c20d2" stroke-width="1.0" stroke-opacity="0.26"/>

  <!-- ── OUTER RING (satellites to adjacent) ─── -->
  <line x1="568" y1="250" x2="484" y2="104"  stroke="#5bc2fc" stroke-width="0.7" stroke-opacity="0.18" stroke-dasharray="3 7"/>
  <line x1="484" y1="104" x2="316" y2="104"  stroke="#6c20d2" stroke-width="0.7" stroke-opacity="0.16" stroke-dasharray="3 7"/>
  <line x1="316" y1="104" x2="232" y2="250"  stroke="#5bc2fc" stroke-width="0.7" stroke-opacity="0.16" stroke-dasharray="3 7"/>
  <line x1="232" y1="250" x2="316" y2="396"  stroke="#6c20d2" stroke-width="0.7" stroke-opacity="0.14" stroke-dasharray="3 7"/>
  <line x1="316" y1="396" x2="484" y2="396"  stroke="#5bc2fc" stroke-width="0.7" stroke-opacity="0.14" stroke-dasharray="3 7"/>
  <line x1="484" y1="396" x2="568" y2="250"  stroke="#6c20d2" stroke-width="0.7" stroke-opacity="0.16" stroke-dasharray="3 7"/>

  <!-- ── Flow dots at spoke midpoints ─── -->
  <circle cx="484" cy="250" r="3" fill="#5bc2fc" fill-opacity="0.45"/>
  <circle cx="442" cy="323" r="2.5" fill="#6c20d2" fill-opacity="0.40"/>
  <circle cx="358" cy="323" r="2.5" fill="#5bc2fc" fill-opacity="0.38"/>
  <circle cx="316" cy="250" r="3"   fill="#6c20d2" fill-opacity="0.42"/>
  <circle cx="358" cy="177" r="2.5" fill="#5bc2fc" fill-opacity="0.38"/>
  <circle cx="442" cy="177" r="2.5" fill="#6c20d2" fill-opacity="0.40"/>

  <!-- ══════════════════════════════════
       SATELLITE NODE 1 — East (568,250) azure
  ═══════════════════════════════════════ -->
  <circle cx="568" cy="250" r="40" fill="url(#i1glowA)" filter="url(#i1glow)"/>
  <circle cx="568" cy="250" r="24" fill="#5bc2fc" fill-opacity="0.10" stroke="#5bc2fc" stroke-width="1.4" stroke-opacity="0.45"/>
  <!-- Person: head + body clipped to badge -->
  <circle cx="568" cy="242" r="10" fill="#5bc2fc" fill-opacity="0.88" clip-path="url(#i1cp1)"/>
  <ellipse cx="568" cy="266" rx="14" ry="10" fill="#5bc2fc" fill-opacity="0.88" clip-path="url(#i1cp1)"/>

  <!-- SATELLITE NODE 2 — SE (484,396) violet -->
  <circle cx="484" cy="396" r="38" fill="url(#i1glowV)" filter="url(#i1glow)"/>
  <circle cx="484" cy="396" r="24" fill="#6c20d2" fill-opacity="0.10" stroke="#6c20d2" stroke-width="1.4" stroke-opacity="0.42"/>
  <circle cx="484" cy="388" r="10" fill="#6c20d2" fill-opacity="0.85" clip-path="url(#i1cp2)"/>
  <ellipse cx="484" cy="412" rx="14" ry="10" fill="#6c20d2" fill-opacity="0.85" clip-path="url(#i1cp2)"/>

  <!-- SATELLITE NODE 3 — SW (316,396) azure -->
  <circle cx="316" cy="396" r="38" fill="url(#i1glowA)" filter="url(#i1glow)"/>
  <circle cx="316" cy="396" r="24" fill="#5bc2fc" fill-opacity="0.10" stroke="#5bc2fc" stroke-width="1.4" stroke-opacity="0.42"/>
  <circle cx="316" cy="388" r="10" fill="#5bc2fc" fill-opacity="0.85" clip-path="url(#i1cp3)"/>
  <ellipse cx="316" cy="412" rx="14" ry="10" fill="#5bc2fc" fill-opacity="0.85" clip-path="url(#i1cp3)"/>

  <!-- SATELLITE NODE 4 — West (232,250) violet -->
  <circle cx="232" cy="250" r="40" fill="url(#i1glowV)" filter="url(#i1glow)"/>
  <circle cx="232" cy="250" r="24" fill="#6c20d2" fill-opacity="0.10" stroke="#6c20d2" stroke-width="1.4" stroke-opacity="0.45"/>
  <circle cx="232" cy="242" r="10" fill="#6c20d2" fill-opacity="0.88" clip-path="url(#i1cp4)"/>
  <ellipse cx="232" cy="266" rx="14" ry="10" fill="#6c20d2" fill-opacity="0.88" clip-path="url(#i1cp4)"/>

  <!-- SATELLITE NODE 5 — NW (316,104) azure -->
  <circle cx="316" cy="104" r="38" fill="url(#i1glowA)" filter="url(#i1glow)"/>
  <circle cx="316" cy="104" r="24" fill="#5bc2fc" fill-opacity="0.10" stroke="#5bc2fc" stroke-width="1.4" stroke-opacity="0.42"/>
  <circle cx="316" cy="96"  r="10" fill="#5bc2fc" fill-opacity="0.85" clip-path="url(#i1cp5)"/>
  <ellipse cx="316" cy="120" rx="14" ry="10" fill="#5bc2fc" fill-opacity="0.85" clip-path="url(#i1cp5)"/>

  <!-- SATELLITE NODE 6 — NE (484,104) violet -->
  <circle cx="484" cy="104" r="38" fill="url(#i1glowV)" filter="url(#i1glow)"/>
  <circle cx="484" cy="104" r="24" fill="#6c20d2" fill-opacity="0.10" stroke="#6c20d2" stroke-width="1.4" stroke-opacity="0.42"/>
  <circle cx="484" cy="96"  r="10" fill="#6c20d2" fill-opacity="0.85" clip-path="url(#i1cp6)"/>
  <ellipse cx="484" cy="120" rx="14" ry="10" fill="#6c20d2" fill-opacity="0.85" clip-path="url(#i1cp6)"/>

  <!-- ══════════════════════════════════
       CENTER HUB — Innovation Manager
  ═══════════════════════════════════════ -->
  <circle cx="400" cy="250" r="75"  fill="url(#i1glowC)" filter="url(#i1glow)"/>
  <!-- Outer decorative ring -->
  <circle cx="400" cy="250" r="55"  fill="none" stroke="#5bc2fc" stroke-width="1.0" stroke-opacity="0.25" stroke-dasharray="5 6"/>
  <!-- Badge background -->
  <circle cx="400" cy="250" r="44"  fill="#5bc2fc" fill-opacity="0.12" stroke="#5bc2fc" stroke-width="2.0" stroke-opacity="0.55"/>
  <!-- Person: head -->
  <circle cx="400" cy="236" r="16"  fill="#5bc2fc" fill-opacity="0.94" clip-path="url(#i1cp0)"/>
  <!-- Person: body -->
  <ellipse cx="400" cy="269" rx="24" ry="18" fill="#5bc2fc" fill-opacity="0.94" clip-path="url(#i1cp0)"/>
  <!-- Crown/highlight ring (distinguishes manager) -->
  <circle cx="400" cy="250" r="50"  fill="none" stroke="#5bc2fc" stroke-width="1.8" stroke-opacity="0.35"/>

  <!-- Ambient particles -->
  <circle cx="650" cy="160" r="1.5" fill="#5bc2fc" fill-opacity="0.20"/>
  <circle cx="700" cy="310" r="1.5" fill="#6c20d2" fill-opacity="0.18"/>
  <circle cx="140" cy="340" r="1.5" fill="#5bc2fc" fill-opacity="0.18"/>
  <circle cx="110" cy="150" r="1.5" fill="#6c20d2" fill-opacity="0.16"/>
  <circle cx="580" cy="460" r="1.2" fill="#5bc2fc" fill-opacity="0.15"/>
  <circle cx="220" cy="450" r="1.2" fill="#6c20d2" fill-opacity="0.14"/>
</svg>
