<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="i2-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#040315"/>
      <stop offset="100%" stop-color="#07041f"/>
    </linearGradient>
    <linearGradient id="i2-flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#6c20d2" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#6c20d2" stop-opacity="0.7"/>
      <stop offset="65%"  stop-color="#5bc2fc" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#5bc2fc" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="i2-flow2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#d21c82" stop-opacity="0"/>
      <stop offset="25%"  stop-color="#d21c82" stop-opacity="0.5"/>
      <stop offset="60%"  stop-color="#5bc2fc" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#5bc2fc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="i2-node-l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6c20d2" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6c20d2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="i2-node-r" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5bc2fc" stop-opacity="0"/>
      <stop offset="100%" stop-color="#5bc2fc" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="i2-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="i2-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <pattern id="i2-dots" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="18" r="0.8" fill="rgba(255,255,255,0.04)"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#i2-bg)"/>
  <rect width="800" height="500" fill="url(#i2-dots)"/>

  <!-- Central axis line -->
  <line x1="60" y1="250" x2="740" y2="250" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Left cluster: scattered irregular nodes (chaos/input) -->
  <!-- Large violet glow -->
  <circle cx="160" cy="250" r="70" fill="#6c20d2" fill-opacity="0.06" filter="url(#i2-blur)"/>

  <!-- Scattered dots left side -->
  <circle cx="90"  cy="148" r="4" fill="#6c20d2" fill-opacity="0.60" stroke="#9b6de8" stroke-width="0.8"/>
  <circle cx="128" cy="205" r="5" fill="#6c20d2" fill-opacity="0.70" stroke="#9b6de8" stroke-width="1"/>
  <circle cx="75"  cy="265" r="3" fill="#6c20d2" fill-opacity="0.55"/>
  <circle cx="155" cy="178" r="6" fill="#6c20d2" fill-opacity="0.75" stroke="#9b6de8" stroke-width="1.2"/>
  <circle cx="100" cy="315" r="4" fill="#6c20d2" fill-opacity="0.58"/>
  <circle cx="170" cy="305" r="5" fill="#6c20d2" fill-opacity="0.68" stroke="#9b6de8" stroke-width="0.8"/>
  <circle cx="130" cy="360" r="3.5" fill="#6c20d2" fill-opacity="0.52"/>
  <circle cx="195" cy="238" r="7" fill="#6c20d2" fill-opacity="0.80" stroke="#9b6de8" stroke-width="1.5"/>
  <circle cx="75"  cy="390" r="3" fill="#6c20d2" fill-opacity="0.42"/>
  <circle cx="200" cy="130" r="4" fill="#6c20d2" fill-opacity="0.55"/>
  <circle cx="115" cy="430" r="2.5" fill="#6c20d2" fill-opacity="0.38"/>

  <!-- Loose connector lines (left cluster internal) -->
  <line x1="128" y1="205" x2="155" y2="178" stroke="#6c20d2" stroke-width="0.7" stroke-opacity="0.35"/>
  <line x1="155" y1="178" x2="195" y2="238" stroke="#6c20d2" stroke-width="0.8" stroke-opacity="0.38"/>
  <line x1="195" y1="238" x2="170" y2="305" stroke="#6c20d2" stroke-width="0.7" stroke-opacity="0.32"/>
  <line x1="128" y1="205" x2="75"  y2="265" stroke="#6c20d2" stroke-width="0.5" stroke-opacity="0.25"/>
  <line x1="90"  cy="148" x2="128" y2="205" stroke="#6c20d2" stroke-width="0.5" stroke-opacity="0.22"/>
  <line x1="170" y1="305" x2="100" y2="315" stroke="#6c20d2" stroke-width="0.5" stroke-opacity="0.22"/>

  <!-- Flowing streams (left → center → right) -->
  <!-- Stream 1 — upper -->
  <path d="M 220,155 C 300,155 320,200 400,200 C 480,200 500,168 580,168"
        fill="none" stroke="url(#i2-flow)" stroke-width="1.4" stroke-opacity="0.7"/>
  <!-- Stream 2 — main upper -->
  <path d="M 220,200 C 290,200 310,228 400,228 C 490,228 510,215 580,215"
        fill="none" stroke="url(#i2-flow)" stroke-width="2.0" stroke-opacity="0.8"/>
  <!-- Stream 3 — central -->
  <path d="M 220,250 C 300,250 350,250 400,250 C 450,250 500,250 580,250"
        fill="none" stroke="url(#i2-flow)" stroke-width="2.6" stroke-opacity="0.85"/>
  <!-- Stream 4 — main lower -->
  <path d="M 220,300 C 290,300 310,272 400,272 C 490,272 510,285 580,285"
        fill="none" stroke="url(#i2-flow)" stroke-width="2.0" stroke-opacity="0.8"/>
  <!-- Stream 5 — lower -->
  <path d="M 220,345 C 300,345 320,300 400,300 C 480,300 500,332 580,332"
        fill="none" stroke="url(#i2-flow)" stroke-width="1.4" stroke-opacity="0.7"/>

  <!-- Faint extra streams -->
  <path d="M 220,130 C 310,130 330,185 400,185 C 470,185 490,152 580,152"
        fill="none" stroke="url(#i2-flow2)" stroke-width="0.8" stroke-opacity="0.5"/>
  <path d="M 220,370 C 310,370 330,315 400,315 C 470,315 490,348 580,348"
        fill="none" stroke="url(#i2-flow2)" stroke-width="0.8" stroke-opacity="0.5"/>

  <!-- Central convergence point glow -->
  <circle cx="400" cy="250" r="45" fill="#5bc2fc" fill-opacity="0.04" filter="url(#i2-blur)"/>
  <circle cx="400" cy="250" r="22" fill="none" stroke="#5bc2fc" stroke-width="0.8" stroke-opacity="0.22" stroke-dasharray="3 6"/>
  <circle cx="400" cy="250" r="7"  fill="#5bc2fc" fill-opacity="0.60"/>
  <circle cx="400" cy="250" r="3"  fill="rgba(200,240,255,0.9)"/>

  <!-- Right cluster: ordered grid nodes (structure/output) -->
  <!-- Azure glow -->
  <circle cx="640" cy="250" r="70" fill="#5bc2fc" fill-opacity="0.05" filter="url(#i2-blur)"/>

  <!-- Grid nodes right side: 4×5 arrangement, tighter, more ordered -->
  <!-- Column x=600 -->
  <circle cx="600" cy="170" r="4" fill="#5bc2fc" fill-opacity="0.65" stroke="rgba(140,210,255,0.5)" stroke-width="0.8"/>
  <circle cx="600" cy="210" r="5" fill="#5bc2fc" fill-opacity="0.75" stroke="rgba(140,210,255,0.6)" stroke-width="1"/>
  <circle cx="600" cy="250" r="6" fill="#5bc2fc" fill-opacity="0.85" stroke="rgba(140,210,255,0.7)" stroke-width="1.2"/>
  <circle cx="600" cy="290" r="5" fill="#5bc2fc" fill-opacity="0.75" stroke="rgba(140,210,255,0.6)" stroke-width="1"/>
  <circle cx="600" cy="330" r="4" fill="#5bc2fc" fill-opacity="0.65" stroke="rgba(140,210,255,0.5)" stroke-width="0.8"/>
  <!-- Column x=648 -->
  <circle cx="648" cy="170" r="4" fill="#5bc2fc" fill-opacity="0.60" stroke="rgba(140,210,255,0.4)" stroke-width="0.8"/>
  <circle cx="648" cy="210" r="5" fill="#5bc2fc" fill-opacity="0.70" stroke="rgba(140,210,255,0.5)" stroke-width="1"/>
  <circle cx="648" cy="250" r="6" fill="#5bc2fc" fill-opacity="0.80" stroke="rgba(140,210,255,0.6)" stroke-width="1.2"/>
  <circle cx="648" cy="290" r="5" fill="#5bc2fc" fill-opacity="0.70" stroke="rgba(140,210,255,0.5)" stroke-width="1"/>
  <circle cx="648" cy="330" r="4" fill="#5bc2fc" fill-opacity="0.60" stroke="rgba(140,210,255,0.4)" stroke-width="0.8"/>
  <!-- Column x=696 -->
  <circle cx="696" cy="190" r="3.5" fill="#5bc2fc" fill-opacity="0.55"/>
  <circle cx="696" cy="230" r="4.5" fill="#5bc2fc" fill-opacity="0.65" stroke="rgba(140,210,255,0.4)" stroke-width="0.8"/>
  <circle cx="696" cy="250" r="5" fill="#5bc2fc" fill-opacity="0.72" stroke="rgba(140,210,255,0.5)" stroke-width="1"/>
  <circle cx="696" cy="270" r="4.5" fill="#5bc2fc" fill-opacity="0.65" stroke="rgba(140,210,255,0.4)" stroke-width="0.8"/>
  <circle cx="696" cy="310" r="3.5" fill="#5bc2fc" fill-opacity="0.55"/>

  <!-- Grid connectors right (horizontal + vertical) -->
  <line x1="600" y1="170" x2="648" y2="170" stroke="#5bc2fc" stroke-width="0.6" stroke-opacity="0.30"/>
  <line x1="600" y1="210" x2="648" y2="210" stroke="#5bc2fc" stroke-width="0.6" stroke-opacity="0.32"/>
  <line x1="600" y1="250" x2="648" y2="250" stroke="#5bc2fc" stroke-width="0.8" stroke-opacity="0.35"/>
  <line x1="600" y1="290" x2="648" y2="290" stroke="#5bc2fc" stroke-width="0.6" stroke-opacity="0.32"/>
  <line x1="600" y1="330" x2="648" y2="330" stroke="#5bc2fc" stroke-width="0.6" stroke-opacity="0.28"/>
  <line x1="648" y1="230" x2="696" y2="230" stroke="#5bc2fc" stroke-width="0.5" stroke-opacity="0.25"/>
  <line x1="648" y1="250" x2="696" y2="250" stroke="#5bc2fc" stroke-width="0.6" stroke-opacity="0.28"/>
  <line x1="648" y1="270" x2="696" y2="270" stroke="#5bc2fc" stroke-width="0.5" stroke-opacity="0.25"/>
  <!-- Verticals -->
  <line x1="600" y1="170" x2="600" y2="330" stroke="#5bc2fc" stroke-width="0.5" stroke-opacity="0.22"/>
  <line x1="648" y1="170" x2="648" y2="330" stroke="#5bc2fc" stroke-width="0.5" stroke-opacity="0.22"/>
</svg>
