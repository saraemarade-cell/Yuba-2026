<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="i2bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#040315"/>
      <stop offset="100%" stop-color="#06041c"/>
    </linearGradient>
    <linearGradient id="i2arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#6c20d2"/>
      <stop offset="100%" stop-color="#dbfe69"/>
    </linearGradient>
    <radialGradient id="i2gV" cx="30%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#6c20d2" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#6c20d2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i2gA" cx="70%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#5bc2fc" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#5bc2fc" stop-opacity="0"/>
    </radialGradient>
    <filter id="i2glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="i2sm" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <pattern id="i2dots" width="38" height="38" patternUnits="userSpaceOnUse">
      <circle cx="19" cy="19" r="0.7" fill="rgba(255,255,255,0.04)"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#i2bg)"/>
  <rect width="800" height="500" fill="url(#i2dots)"/>

  <!-- Area glow left (violet) and right (azure) -->
  <rect width="380" height="500" fill="url(#i2gV)"/>
  <rect x="420" width="380" height="500" fill="url(#i2gA)"/>

  <!-- Vertical center divider (subtle) -->
  <line x1="400" y1="40" x2="400" y2="460" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- ═══════════════════════════════════
       LEFT SIDE — Old model (4 modules, violet, hierarchy)
       Linear/stacked arrangement = rigid structure
  ════════════════════════════════════════ -->

  <!-- Module block helper: rect + inner lines -->

  <!-- Block A — top (145, 118) -->
  <g filter="url(#i2sm)">
    <rect x="100" y="98" width="90" height="60" rx="8" fill="#6c20d2" fill-opacity="0.14" stroke="#6c20d2" stroke-width="1.6" stroke-opacity="0.55"/>
  </g>
  <rect x="100" y="98" width="90" height="60" rx="8" fill="#6c20d2" fill-opacity="0.08" stroke="#6c20d2" stroke-width="1.6" stroke-opacity="0.55"/>
  <!-- Inner lines (card content) -->
  <line x1="116" y1="122" x2="174" y2="122" stroke="#6c20d2" stroke-width="1.2" stroke-opacity="0.45"/>
  <line x1="116" y1="134" x2="158" y2="134" stroke="#6c20d2" stroke-width="1.0" stroke-opacity="0.30"/>
  <!-- Corner dot (icon placeholder) -->
  <circle cx="165" cy="111" r="5" fill="#6c20d2" fill-opacity="0.55"/>

  <!-- Block B — (155, 208) slightly offset right -->
  <g filter="url(#i2sm)">
    <rect x="110" y="190" width="90" height="60" rx="8" fill="#6c20d2" fill-opacity="0.14" stroke="#6c20d2" stroke-width="1.6" stroke-opacity="0.52"/>
  </g>
  <rect x="110" y="190" width="90" height="60" rx="8" fill="#6c20d2" fill-opacity="0.08" stroke="#6c20d2" stroke-width="1.6" stroke-opacity="0.52"/>
  <line x1="126" y1="214" x2="184" y2="214" stroke="#6c20d2" stroke-width="1.2" stroke-opacity="0.42"/>
  <line x1="126" y1="226" x2="165" y2="226" stroke="#6c20d2" stroke-width="1.0" stroke-opacity="0.28"/>
  <circle cx="172" cy="203" r="5" fill="#6c20d2" fill-opacity="0.52"/>

  <!-- Block C — (130, 296) back to left -->
  <g filter="url(#i2sm)">
    <rect x="90" y="278" width="90" height="60" rx="8" fill="#6c20d2" fill-opacity="0.14" stroke="#6c20d2" stroke-width="1.6" stroke-opacity="0.48"/>
  </g>
  <rect x="90" y="278" width="90" height="60" rx="8" fill="#6c20d2" fill-opacity="0.08" stroke="#6c20d2" stroke-width="1.6" stroke-opacity="0.48"/>
  <line x1="106" y1="302" x2="164" y2="302" stroke="#6c20d2" stroke-width="1.2" stroke-opacity="0.38"/>
  <line x1="106" y1="314" x2="145" y2="314" stroke="#6c20d2" stroke-width="1.0" stroke-opacity="0.25"/>
  <circle cx="152" cy="291" r="5" fill="#6c20d2" fill-opacity="0.48"/>

  <!-- Block D — (150, 382) -->
  <g filter="url(#i2sm)">
    <rect x="108" y="364" width="90" height="60" rx="8" fill="#6c20d2" fill-opacity="0.14" stroke="#6c20d2" stroke-width="1.6" stroke-opacity="0.44"/>
  </g>
  <rect x="108" y="364" width="90" height="60" rx="8" fill="#6c20d2" fill-opacity="0.08" stroke="#6c20d2" stroke-width="1.6" stroke-opacity="0.44"/>
  <line x1="124" y1="388" x2="182" y2="388" stroke="#6c20d2" stroke-width="1.2" stroke-opacity="0.34"/>
  <line x1="124" y1="400" x2="160" y2="400" stroke="#6c20d2" stroke-width="1.0" stroke-opacity="0.22"/>
  <circle cx="170" cy="377" r="5" fill="#6c20d2" fill-opacity="0.44"/>

  <!-- Left hierarchy connectors (A→B→C→D) — vertical lines + small branch B→side -->
  <line x1="145" y1="158" x2="155" y2="190" stroke="#6c20d2" stroke-width="1.0" stroke-opacity="0.35"/>
  <line x1="155" y1="250" x2="135" y2="278" stroke="#6c20d2" stroke-width="1.0" stroke-opacity="0.30"/>
  <line x1="135" y1="338" x2="153" y2="364" stroke="#6c20d2" stroke-width="1.0" stroke-opacity="0.26"/>
  <!-- Terminal dots on connector ends -->
  <circle cx="145" cy="158" r="2.5" fill="#6c20d2" fill-opacity="0.50"/>
  <circle cx="155" cy="190" r="2.5" fill="#6c20d2" fill-opacity="0.48"/>
  <circle cx="155" cy="250" r="2.5" fill="#6c20d2" fill-opacity="0.45"/>
  <circle cx="135" cy="278" r="2.5" fill="#6c20d2" fill-opacity="0.42"/>
  <circle cx="135" cy="338" r="2.5" fill="#6c20d2" fill-opacity="0.38"/>
  <circle cx="153" cy="364" r="2.5" fill="#6c20d2" fill-opacity="0.36"/>

  <!-- ═══════════════════════════════════
       CENTER — Transformation arrow
  ════════════════════════════════════════ -->
  <!-- Arrow glow -->
  <path d="M 290,250 H 510" stroke="url(#i2arrow)" stroke-width="18" stroke-linecap="round" stroke-opacity="0.08" filter="url(#i2glow)"/>
  <!-- Arrow shaft -->
  <path d="M 295,250 H 490" stroke="url(#i2arrow)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Arrow head -->
  <path d="M 480,236 L 510,250 L 480,264" fill="none" stroke="#dbfe69" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Arrow tail (left end mark) -->
  <circle cx="295" cy="250" r="4.5" fill="#6c20d2" fill-opacity="0.80"/>

  <!-- Circular "rotate/transform" symbol around arrow midpoint -->
  <circle cx="400" cy="250" r="30" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="4 8"/>
  <!-- Small rotation arcs at 12 and 6 o'clock -->
  <path d="M 390,221 A 29,29 0 0,1 410,221" fill="none" stroke="#dbfe69" stroke-width="2" stroke-linecap="round" stroke-opacity="0.5"/>
  <path d="M 410,279 A 29,29 0 0,1 390,279" fill="none" stroke="#dbfe69" stroke-width="2" stroke-linecap="round" stroke-opacity="0.5"/>

  <!-- ═══════════════════════════════════
       RIGHT SIDE — New model (4 modules, azure, matrix)
       2×2 connected grid = integrated system
  ════════════════════════════════════════ -->

  <!-- Block 1 — top-left of matrix (590, 170) -->
  <g filter="url(#i2sm)">
    <rect x="554" y="142" width="90" height="60" rx="8" fill="#5bc2fc" fill-opacity="0.14" stroke="#5bc2fc" stroke-width="1.6" stroke-opacity="0.60"/>
  </g>
  <rect x="554" y="142" width="90" height="60" rx="8" fill="#5bc2fc" fill-opacity="0.10" stroke="#5bc2fc" stroke-width="1.6" stroke-opacity="0.60"/>
  <line x1="570" y1="166" x2="628" y2="166" stroke="#5bc2fc" stroke-width="1.2" stroke-opacity="0.50"/>
  <line x1="570" y1="178" x2="610" y2="178" stroke="#5bc2fc" stroke-width="1.0" stroke-opacity="0.32"/>
  <circle cx="620" cy="155" r="5" fill="#5bc2fc" fill-opacity="0.65"/>

  <!-- Block 2 — top-right of matrix (690, 170) -->
  <g filter="url(#i2sm)">
    <rect x="656" y="142" width="90" height="60" rx="8" fill="#5bc2fc" fill-opacity="0.14" stroke="#5bc2fc" stroke-width="1.6" stroke-opacity="0.58"/>
  </g>
  <rect x="656" y="142" width="90" height="60" rx="8" fill="#5bc2fc" fill-opacity="0.10" stroke="#5bc2fc" stroke-width="1.6" stroke-opacity="0.58"/>
  <line x1="672" y1="166" x2="730" y2="166" stroke="#5bc2fc" stroke-width="1.2" stroke-opacity="0.48"/>
  <line x1="672" y1="178" x2="712" y2="178" stroke="#5bc2fc" stroke-width="1.0" stroke-opacity="0.30"/>
  <circle cx="722" cy="155" r="5" fill="#5bc2fc" fill-opacity="0.62"/>

  <!-- Block 3 — bottom-left of matrix (590, 298) -->
  <g filter="url(#i2sm)">
    <rect x="554" y="296" width="90" height="60" rx="8" fill="#5bc2fc" fill-opacity="0.14" stroke="#5bc2fc" stroke-width="1.6" stroke-opacity="0.58"/>
  </g>
  <rect x="554" y="296" width="90" height="60" rx="8" fill="#5bc2fc" fill-opacity="0.10" stroke="#5bc2fc" stroke-width="1.6" stroke-opacity="0.58"/>
  <line x1="570" y1="320" x2="628" y2="320" stroke="#5bc2fc" stroke-width="1.2" stroke-opacity="0.48"/>
  <line x1="570" y1="332" x2="610" y2="332" stroke="#5bc2fc" stroke-width="1.0" stroke-opacity="0.30"/>
  <circle cx="620" cy="309" r="5" fill="#5bc2fc" fill-opacity="0.62"/>

  <!-- Block 4 — bottom-right of matrix (690, 298) -->
  <g filter="url(#i2sm)">
    <rect x="656" y="296" width="90" height="60" rx="8" fill="#5bc2fc" fill-opacity="0.14" stroke="#5bc2fc" stroke-width="1.6" stroke-opacity="0.55"/>
  </g>
  <rect x="656" y="296" width="90" height="60" rx="8" fill="#5bc2fc" fill-opacity="0.10" stroke="#5bc2fc" stroke-width="1.6" stroke-opacity="0.55"/>
  <line x1="672" y1="320" x2="730" y2="320" stroke="#5bc2fc" stroke-width="1.2" stroke-opacity="0.45"/>
  <line x1="672" y1="332" x2="712" y2="332" stroke="#5bc2fc" stroke-width="1.0" stroke-opacity="0.28"/>
  <circle cx="722" cy="309" r="5" fill="#5bc2fc" fill-opacity="0.60"/>

  <!-- Matrix connections (all 4 blocks fully interconnected) -->
  <!-- H: 1→2 and 3→4 -->
  <line x1="644" y1="172" x2="656" y2="172" stroke="#5bc2fc" stroke-width="2.0" stroke-opacity="0.50"/>
  <line x1="644" y1="326" x2="656" y2="326" stroke="#5bc2fc" stroke-width="2.0" stroke-opacity="0.48"/>
  <!-- V: 1→3 and 2→4 -->
  <line x1="599" y1="202" x2="599" y2="296" stroke="#5bc2fc" stroke-width="2.0" stroke-opacity="0.48"/>
  <line x1="701" y1="202" x2="701" y2="296" stroke="#5bc2fc" stroke-width="2.0" stroke-opacity="0.46"/>
  <!-- Diagonal: 1→4 -->
  <line x1="644" y1="202" x2="656" y2="296" stroke="#5bc2fc" stroke-width="1.0" stroke-opacity="0.28" stroke-dasharray="3 5"/>
  <!-- Diagonal: 2→3 -->
  <line x1="656" y1="202" x2="644" y2="296" stroke="#5bc2fc" stroke-width="1.0" stroke-opacity="0.26" stroke-dasharray="3 5"/>
  <!-- Junction dots -->
  <circle cx="644" cy="172" r="3" fill="#5bc2fc" fill-opacity="0.65"/>
  <circle cx="656" cy="172" r="3" fill="#5bc2fc" fill-opacity="0.65"/>
  <circle cx="644" cy="326" r="3" fill="#5bc2fc" fill-opacity="0.62"/>
  <circle cx="656" cy="326" r="3" fill="#5bc2fc" fill-opacity="0.62"/>
  <circle cx="599" cy="249" r="3" fill="#5bc2fc" fill-opacity="0.60"/>
  <circle cx="701" cy="249" r="3" fill="#5bc2fc" fill-opacity="0.58"/>
</svg>
